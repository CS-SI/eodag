dlr_eoc_geoservice:
  priority: 0
  description: DLR Earth Observation Center (EOC) Geoservice
  roles:
    - host
  url: https://geoservice.dlr.de
  search:
    type: StacSearch
    api_endpoint: https://geoservice.dlr.de/eoc/ogc/stac/v1/search
    sort:
      sort_by_default:
        -  [start_datetime, ASC]
      sort_param_mapping:
        id: id
        start_datetime: properties.datetime
        created: properties.created
        updated: properties.updated
        eo:cloud_cover: properties.eo:cloud_cover
  products:
    S2_MSI_L2A_MAJA:
      _collection: S2_L2A_MAJA
      assets_mapping:
        download_link:
          href: '$.assets.data.href'
          roles: '["archive", "data"]'
          type: 'application/octet-stream'
    SUPERSITES:
      _collection: SUPERSITES
      assets_mapping:
        download_link:
          href: '$.assets.data.href'
          roles: '["archive", "data"]'
          type: 'application/octet-stream'
    GENERIC_COLLECTION:
      _collection: '{collection}'
  download:
    type: HTTPDownload
    auth_error_code:
      - 401
      - 403
  auth:
    type: GenericAuth
    matching_url: https://download.geoservice.dlr.de
