[tox]
requires = tox-uv
envlist = py39, py310, py311, py312, py313, py314, docs, pypi, linters

# Mapping required by tox-gh-actions, only used in CI
[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
description = Run the unit, integration and doctest suite
commands =
    python -c "import os; os.makedirs(r'{env:EODAG_TEST_REPORTS}', exist_ok=True)"
    pytest -v --instafail \
        -n auto --dist loadscope \
        --cov=eodag \
        --cov-report term-missing \
        --cov-report=html:{env:EODAG_TEST_REPORTS}/coverage \
        --cov-report=xml:{env:EODAG_TEST_REPORTS}/coverage.xml \
        --junitxml={env:EODAG_TEST_REPORTS}/junit-report.xml \
        --html={env:EODAG_TEST_REPORTS}/tests/report.html \
        --self-contained-html {posargs: --ignore=tests/test_end_to_end.py --ignore=tests/test_benchmark.py}

extras = dev

setenv =
    COVERAGE_FILE=.coverage.{envname}
    EODAG_TEST_REPORTS={toxinidir}/test-reports
    # Any IO done by eodag or the tests should now be done in the local env /tmp
    # This prevents race conditions when running the tests in parallel
    TMPDIR={envtmpdir}
    HOME={envtmpdir}

[testenv:min-deps]
description = Test lowest direct runtime dependencies on Python 3.9
basepython = python3.9
skip_install = true
allowlist_externals = uv
setenv =
    {[testenv]setenv}
    EODAG_TEST_REPORTS={toxinidir}/test-reports/min-deps
    UV_PYTHON={envpython}
commands_pre =
    # Pin direct runtime deps to their declared minimums (transitive deps stay latest compatible)
    uv pip compile --resolution lowest-direct --upgrade \
        --output-file "{env:EODAG_TEST_REPORTS}/runtime-requirements.txt" \
        "{toxinidir}/pyproject.toml"
    # Reset the env to exactly these pins, removing leftovers from previous runs
    uv pip sync "{env:EODAG_TEST_REPORTS}/runtime-requirements.txt"
    # Install eodag and test tools without upgrading the pinned runtime deps;
    # stac-validator instead of dev's stac-valid, which needs tqdm>=4.66 (above runtime minimum)
    uv pip install \
        --constraint "{env:EODAG_TEST_REPORTS}/runtime-requirements.txt" \
        "{toxinidir}[test]" "stac-validator >= 3.7.0"

[testenv:docs]
description = Build the HTML documentation
basepython = python3.13
changedir = {toxinidir}/docs
usedevelop = false
extras = docs
allowlist_externals = /usr/bin/make
commands =
    # generate collections information csv table
    python {toxinidir}/utils/collections_information_to_csv.py
    # clean previously auto-generated docs to avoid stale files
    python -c "import shutil, os;\
        [shutil.rmtree(os.path.join('{toxinidir}', 'docs', d), ignore_errors=True)\
        for d in ('drivers_generated', 'plugins_reference/generated')]"
    # build doc
    make html SPHINXOPTS="-W --keep-going"

[testenv:benchmark]
description = Run performance benchmarks
basepython = python3.14
deps =
    pytest<9.2.0
    pytest-benchmark[histogram] @ git+https://github.com/ionelmc/pytest-benchmark.git@master
    eodag-cube
commands =
    pytest -v tests/test_benchmark.py --benchmark-disable-gc {posargs}

[testenv:pypi]
description = Build and validate the package for PyPI
skip_install = true
# To prevent from installing eodag and the dev deps set in testenv
deps =
    build
    twine
commands =
    # build package to be checked
    python -m build --installer uv
    # Check that the long description is ready to be published on PyPI without errors
    python -m twine check dist/*

[testenv:linters]
description = Run formatting, lint and type checks
basepython = python3.9
commands =
    prek run --all-files
    python -m mypy -p eodag
